# Syncs detector secrets from the cloud secret manager provisioned by
# deployments/terraform/<cloud>. Requires the External Secrets Operator and a
# ClusterSecretStore named "platform-secrets" bound to that secret manager.
# Remote keys match the names Terraform creates; the fabric client secret,
# audit key and SIEM token values are written by the security team, never by
# Terraform.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agent-threat-detection-database
  namespace: agent-security
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: agent-threat-detection-database
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: agent-threat-detection-database-url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agent-threat-detection-fabric-client
  namespace: agent-security
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: agent-threat-detection-fabric-client
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: agent-threat-detection-fabric-client-secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agent-threat-detection-audit-key
  namespace: agent-security
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: agent-threat-detection-audit-key
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: "^agent-threat-detection-audit-key-"
      rewrite:
        - regexp:
            source: "^agent-threat-detection-audit-key-(.*)$"
            target: "audit-$1.pem"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agent-threat-detection-siem-token
  namespace: agent-security
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: agent-threat-detection-siem-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: agent-threat-detection-siem-token
