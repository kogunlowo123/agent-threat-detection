# Local development stack: the threat detector, the agent identity fabric it
# contains agents through, PostgreSQL, an OIDC provider that plays the
# workload issuer, the enterprise IdP for analysts and the client-credentials
# token endpoint for the detector, and an OpenTelemetry collector.
# Uses in-memory keys (*_DEV_EPHEMERAL_KEYS); never use this configuration
# outside a developer workstation.
name: agent-threat-detection

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: atd
      POSTGRES_USER: atd
      POSTGRES_PASSWORD: atd-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atd -d atd"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deployments/docker/init-fabric-db.sql:/docker-entrypoint-initdb.d/init-fabric-db.sql:ro

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG_PATH: /config/mock-oauth2.json
    volumes:
      - ./deployments/docker/mock-oauth2.json:/config/mock-oauth2.json:ro
    ports:
      - "8081:8080"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deployments/docker/otel-collector.yaml:/etc/otelcol/config.yaml:ro

  identity-fabric:
    image: ghcr.io/kogunlowo123/agent-identity-fabric:v0.1.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FABRIC_ENVIRONMENT: development
      FABRIC_DEV_EPHEMERAL_KEYS: "true"
      FABRIC_TRUST_DOMAIN: agents.local
      FABRIC_ISSUER: http://identity-fabric:8080
      FABRIC_DATABASE_URL: postgresql+asyncpg://atd:atd-local-only@postgres:5432/fabric
      FABRIC_WORKLOAD_ISSUERS: '{"http://oidc:8080/workload": "http://oidc:8080/workload/jwks"}'
      FABRIC_ADMIN_ISSUER: http://oidc:8080/admin
      FABRIC_ADMIN_AUDIENCE: identity-fabric-admin
      FABRIC_ADMIN_JWKS_URL: http://oidc:8080/admin/jwks
      FABRIC_AUDIT_LOG_PATH: /var/lib/identity-fabric/audit/audit.jsonl
    ports:
      - "8082:8080"

  threat-detection:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      identity-fabric:
        condition: service_started
    ports:
      - "8080:8080"
    configs:
      - source: fabric-client-secret
        target: /run/secrets/fabric-client-secret
    environment:
      THREAT_ENVIRONMENT: development
      THREAT_DEV_EPHEMERAL_KEYS: "true"
      THREAT_PUBLIC_URL: http://localhost:8080
      THREAT_DATABASE_URL: postgresql+asyncpg://atd:atd-local-only@postgres:5432/atd
      THREAT_ANALYST_ISSUER: http://oidc:8080/analysts
      THREAT_ANALYST_AUDIENCE: agent-threat-detection
      THREAT_ANALYST_JWKS_URL: http://oidc:8080/analysts/jwks
      THREAT_FABRIC_URL: http://identity-fabric:8080
      THREAT_FABRIC_TOKEN_URL: http://oidc:8080/admin/token
      THREAT_FABRIC_CLIENT_ID: agent-threat-detection
      THREAT_FABRIC_CLIENT_SECRET_FILE: /run/secrets/fabric-client-secret
      THREAT_PROTECTED_AGENTS: '["spiffe://agents.local/agent/platform/*"]'
      THREAT_DETECTION__INTERNAL_DOMAIN_SUFFIXES: '["local", "internal"]'
      THREAT_MCP_ALLOWED_HOSTS: '["localhost:8080", "threat-detection:8080"]'
      THREAT_AUDIT_LOG_PATH: /var/lib/agent-threat-detection/audit/audit.jsonl
      THREAT_SIEM_MODE: file
      THREAT_SIEM_FILE_PATH: /var/lib/agent-threat-detection/findings/ocsf.jsonl
      THREAT_OTLP_ENDPOINT: http://otel-collector:4317
      THREAT_LOG_LEVEL: DEBUG

configs:
  fabric-client-secret:
    content: local-only-client-secret

volumes:
  pgdata:
